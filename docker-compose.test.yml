# Its own project, deliberately. Without a name this file shared the project
# `alexclaw` with docker-compose.yml, so the two stacks shared one network, and
# the teardown that ends every test run — `docker compose ... down` — removed
# it. With production stopped that succeeded, and production's database then
# would not start: its container still pointed at a network that no longer
# existed. With production running it failed only because production was still
# attached, which is luck rather than protection.
#
# Named apart, the test stack gets alexclaw-test_default and nothing it tears
# down can reach production.
name: alexclaw-test

services:
  db-test:
    container_name: alexclaw-db-test
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: alexclaw
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: alex_claw_test
      # The application role, created by the same script a fresh production
      # volume runs — so every test run also proves a fresh install works. The
      # suite connects as it, so a privilege the application lacks fails here
      # rather than there.
      DATABASE_APP_USERNAME: alexclaw_app
      DATABASE_APP_PASSWORD: apptest
    volumes:
      - ./db-init/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexclaw -d alex_claw_test"]
      interval: 3s
      timeout: 2s
      retries: 5

  test-elixir:
    container_name: alexclaw-test-elixir
    build:
      context: .
      target: test
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      MIX_ENV: test
      DATABASE_USERNAME: alexclaw_app
      DATABASE_PASSWORD: apptest
      # The owner, for creating and migrating only — see the ecto.* aliases.
      DATABASE_OWNER_USERNAME: alexclaw
      DATABASE_OWNER_PASSWORD: testpass
      DATABASE_HOSTNAME: db-test
      DATABASE_NAME: alex_claw_test
      SECRET_KEY_BASE: test_secret_key_base_that_is_at_least_64_bytes_long_for_phoenix_to_accept_it

  # Runs under the production sidecar's constraints (test/compose_hardening_test.exs),
  # so the suite — real Chromium included — proves the browser works that way.
  # The test dependencies are in the image's `test` stage, pinned.
  test-python:
    build:
      context: ./web-automator
      target: test
    entrypoint: ["sh", "-c"]
    command: ["cd /app && python -m pytest tests/ -v -p no:cacheprovider"]
    working_dir: /app
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./web-automator/tests:/app/tests
