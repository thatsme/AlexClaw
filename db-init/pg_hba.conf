# Who may connect to the database. Mounted into db-prod and loaded with
# `-c hba_file=` (docker-compose.yml).
#
# The container's own socket: `docker exec … psql` / `pg_dump`, the health check,
# and the image's first-start initialisation.
local   all   all                        trust

# The network: only the app and the migrate job, by the addresses pinned for
# them in docker-compose.yml. Change these together with those. Nothing else —
# not the rest of the subnet, not its gateway (another network's traffic can
# arrive from the gateway on some engines) — matches a line, so Postgres
# refuses it before any password is asked for.
host    all   all   10.213.61.10/32      scram-sha-256
host    all   all   10.213.61.11/32      scram-sha-256
