services:
  db-prod:
    container_name: alexclaw-db-prod
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      # The owner. Used only when the volume is first initialised; the
      # application role is created by the operator — see the upgrade guide.
      POSTGRES_USER: ${DATABASE_OWNER_USERNAME:-alexclaw}
      POSTGRES_PASSWORD: ${DATABASE_OWNER_PASSWORD}
      POSTGRES_DB: alex_claw_prod
      # For db-init/01-app-role.sh, which creates the application role on a
      # fresh volume. An existing volume ignores both.
      DATABASE_APP_USERNAME: "${DATABASE_USERNAME:?not set - the application role}"
      DATABASE_APP_PASSWORD: "${DATABASE_PASSWORD:?not set - the application role's password}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_OWNER_USERNAME:-alexclaw}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Migrations run here, as the database owner, and nowhere else. This is the
  # only container given the owner's credentials: it migrates, grants the
  # application role its privileges (AlexClaw.Database.Roles), and exits. The
  # application starts only once it has exited cleanly, and connects as the
  # application role — which it checks at boot.
  migrate:
    container_name: alexclaw-migrate
    image: alexclaw-app:latest
    build:
      context: .
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-0}
    command: ["bin/alex_claw", "eval", "AlexClaw.Release.migrate()"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db-prod:
        condition: service_healthy
    environment:
      DATABASE_USERNAME: ${DATABASE_OWNER_USERNAME:-alexclaw}
      DATABASE_PASSWORD: "${DATABASE_OWNER_PASSWORD:?not set - the database owner's password}"
      DATABASE_HOSTNAME: db-prod
      DATABASE_APP_USERNAME: "${DATABASE_USERNAME:?not set - the application role}"
      # No SECRET_KEY_BASE, deliberately: the owner's credentials and the key
      # that decrypts the stored secrets never share a container. The runtime
      # configuration accepts its absence for an eval only.
      CLUSTER_COOKIE: "${CLUSTER_COOKIE:?not set - generate one with: openssl rand -base64 32}"
      RELEASE_TMP: /tmp
      ERL_CRASH_DUMP: /tmp/erl_crash.dump

  alexclaw-prod:
    container_name: alexclaw-prod
    # The BEAM turns SIGTERM into an orderly System.stop/0, but Docker's default
    # grace period is 10 seconds and the supervision tree needs longer: every
    # stop was reaching SIGKILL, so Reasoning.Loop's terminate/2 never ran and
    # in-flight workflow runs stayed recorded as executing.
    stop_grace_period: 30s
    # Nothing writes to the image. The three places that do write are mounted:
    # the skills directory, the backup directory, and a tmpfs for /tmp — which
    # is also where the release puts its generated runtime config and where a
    # crash dump goes.
    read_only: true
    tmpfs:
      - /tmp
    # The app opens a listening socket above 1024 and talks to postgres. It
    # needs nothing the kernel gates behind a capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    image: alexclaw-app:latest
    build:
      context: .
      args:
        BUILD_NUMBER: ${BUILD_NUMBER:-0}
    hostname: node1.local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Loopback by default. The admin UI carries session cookies and the MCP
      # endpoint carries bearer tokens, both in clear over HTTP, so the
      # supported way to reach it from anywhere else is a reverse proxy
      # terminating TLS — which is what docs/deployment/reverse-proxy.md
      # already assumes when it proxies to 127.0.0.1:5001.
      #
      # ADMIN_BIND=0.0.0.0 opens it to the network for anyone who means to.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-5001}:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Database
      # The application role, never the owner: the boot refuses the owner.
      DATABASE_USERNAME: "${DATABASE_USERNAME:?not set - the application role}"
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOSTNAME: db-prod

      # Application
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # The origins the LiveView socket accepts: loopback on the published
      # port, plus PHX_HOST behind a proxy; CHECK_ORIGIN replaces the list.
      ADMIN_PORT: ${ADMIN_PORT:-5001}
      PHX_HOST: ${PHX_HOST:-}
      CHECK_ORIGIN: ${CHECK_ORIGIN:-}

      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

      # LLM providers (at least one required)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Local models (optional)
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      LMSTUDIO_ENABLED: ${LMSTUDIO_ENABLED:-false}
      LMSTUDIO_HOST: ${LMSTUDIO_HOST:-http://host.docker.internal:1234}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}

      # Web automator (optional)
      WEB_AUTOMATOR_ENABLED: ${WEB_AUTOMATOR_ENABLED:-false}
      WEB_AUTOMATOR_HOST: ${WEB_AUTOMATOR_HOST:-http://web-automator:6900}

      # Clustering
      NODE_NAME: ${NODE_NAME:-alexclaw@node1.local}
      CLUSTER_COOKIE: "${CLUSTER_COOKIE:?not set - generate one with: openssl rand -base64 32}"

      # Dynamic skills
      SKILLS_DIR: /app/skills

      # The release's scratch directory defaults to /app/tmp, which is on the
      # read-only filesystem. Nothing writes there on an ordinary boot — that
      # was checked — but the daemon and remote subcommands do, and a default
      # pointing at an unwritable path is a trap rather than a decision.
      RELEASE_TMP: /tmp
      ERL_CRASH_DUMP: /tmp/erl_crash.dump
    volumes:
      - skills_data:/app/skills
      - ${BACKUP_DIR:-./backups}:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Opt-in: built and started only with `--profile web-automation` (or
  # COMPOSE_PROFILES=web-automation in .env). A first run does not build it.
  web-automator:
    profiles: ["web-automation"]
    build: ./web-automator
    restart: unless-stopped
    ports:
      # noVNC gives unauthenticated control of the automation browser, so it is
      # bound to loopback. Reach it over an SSH tunnel rather than the LAN:
      #   ssh -L 6080:127.0.0.1:6080 <host>
      - "127.0.0.1:6080:6080"
    environment:
      DISPLAY: ":99"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6900/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  skills_data:
